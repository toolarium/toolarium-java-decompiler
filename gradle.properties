# base information
projectType              = java-application
projectRootPackageName   = com.github.toolarium.java.decompiler
projectGroupId           = com.github.toolarium
projectComponentId       = toolarium
projectDescription       = A modern, embeddable Java bytecode decompiler library with a clean public API and fluent builder, designed for programmatic integration in tools and IDEs rather than standalone CLI use.
projectUrl               = https://github.com/toolarium/toolarium-java-decompiler

# tool information
# checkstyleToolVersion    = 13.4.0
# testDependencyVersion    = 5.12.2
# sourceCompatibility      = 21
# targetCompatibility      = 21

# jvm information
org.gradle.jvmargs       = -Xmx1g -XX:MaxHeapSize=1g -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.logging.level = quiet
org.gradle.console       = rich
org.gradle.warning.mode  = all

# create fat jar which contains the content
#createFatJar             = true
